# dsh-market-watching 的 bundle patch。
#
# 与 dsh-plugin-crypto-ticker 同一层：在 @deepseek-ai/dsh-base 与
# @deepseek-ai/dsh-web-app 之后、profile 自己的 cordis.patch.yml 之前应用。
# 行的 name 用包名，DSH 通过 profile 的 node_modules 解析它。
#
# 全部 config 可选，下面写的是默认值：
#   enabled           总开关，默认 true；关掉后卡片不渲染、宿主不请求上游
#   schedule          浏览器轮询间隔（秒），默认 15
#   cacheMs           宿主缓存窗口（毫秒），默认 8000
#   upstreamTimeoutMs 单次上游请求超时（毫秒），默认 7000
#   proxy             显式 HTTP 代理（如 'http://127.0.0.1:7897'）；不填则直连
- insert:
    - id: market-watching
      name: dsh-market-watching
